<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRAWS2 Slots</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Orbitron',sans-serif;background:#0b0f14;color:#fff;text-align:center}

header{padding:60px 20px;position:relative}

h1{font-size:50px;color:#00ffcc}
.hero{margin-top:15px;color:#aaa}

.btn{
padding:15px 30px;
background:#00ffcc;
border:none;
border-radius:8px;
cursor:pointer;
margin:10px;
font-size:16px;
transition:.3s
}
.btn:hover{transform:scale(1.05)}

.urgent{color:#ff3b3b;margin-top:10px;animation:pulse 1s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}

.section{padding:30px 20px}

.card{background:#111;padding:20px;margin:10px auto;border-radius:10px;max-width:320px}

.code{color:#00ffcc;font-size:22px;margin-top:10px}

/* POPUP */
.popup{
position:fixed;
bottom:20px;
left:20px;
background:#111;
padding:15px;
border-radius:10px;
font-size:12px;
animation:fade 4s forwards
}

@keyframes fade{0%{opacity:1}100%{opacity:0}}

/* COUNTER */
.counter{color:#00ffcc;font-size:20px;margin-top:10px}

footer{padding:20px;color:#777}
</style>
</head>

<body>

<header>
<h1>KRAWS2</h1>
<p class="hero">🎰 Slots ao vivo • Ganhos reais todos os dias</p>

<button class="btn" onclick="goCasino()">🎰 JOGAR AGORA</button>
<button class="btn" onclick="goEzz()">💸 EZZ.CASINO</button>

<div class="urgent">🔥 +120 pessoas estão a jogar AGORA</div>
<div class="counter" id="players">127 jogadores online</div>
</header>

<section class="section">
<h2>🎁 Bónus Exclusivo</h2>
<div class="card">
<p>Usa o código:</p>
<div class="code">GODENN96</div>
<p>Ativa bónus imediato 💸</p>
</div>
</section>

<section class="section">
<h2>📺 LIVE AGORA</h2>
<button class="btn" onclick="goTwitch()">Ver Stream</button>
</section>

<section class="section">
<h2>💬 Comunidade VIP</h2>
<button class="btn" onclick="goTelegram()">Entrar no Telegram</button>
</section>

<footer>
<p>© 2026 KRAWS2 | EZZ.CASINO</p>
</footer>

<script>
function goCasino(){
 window.location.href='https://ezz.casino/pt?invite=godenn96';
}

function goEzz(){
 window.location.href='https://ezz.casino/pt?invite=godenn96';
}

function goTwitch(){
 window.location.href='https://www.twitch.tv/kraws2';
}

function goTelegram(){
 window.location.href='https://t.me/kRaWS2Slots';
}

/* fake players counter */
let players=120;
setInterval(()=>{
 players+=Math.floor(Math.random()*5);
 document.getElementById('players').innerText=players+" jogadores online";
},2000);

/* popup wins */
function showPopup(){
 let win=Math.floor(Math.random()*3000);
 let div=document.createElement('div');
 div.className='popup';
 div.innerText="Alguém ganhou €"+win;
 document.body.appendChild(div);
 setTimeout(()=>div.remove(),4000);
}

setInterval(showPopup,3000);
</script>

</body>
</html>
